<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半导体知识闯关 · 学生版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230D1326'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%232563EB' font-family='Arial' font-weight='bold'>Si</text></svg>">
<style>
  :root{
    --bg:#0D1326; --card:#151D33; --card2:#1B2440; --line:#2A3656;
    --blue:#2563EB; --blue-l:#60A5FA; --ink:#F2F4F8; --muted:#94A3B8;
    --ok:#22C55E; --bad:#EF4444; --warn:#F59E0B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:radial-gradient(1100px 650px at 75% -10%, #1B2A55 0%, var(--bg) 55%);
    color:var(--ink); min-height:100vh;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  }
  #app{max-width:920px; margin:0 auto; padding:24px 20px 60px; min-height:100vh;}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:12px; transition:.15s;}
  .tag{display:inline-block; font-size:12px; letter-spacing:.14em; color:var(--blue-l);
    border:1px solid var(--line); padding:3px 12px; border-radius:999px;}

  /* 顶栏 */
  .hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 18px;}
  .hud .stat{text-align:center;}
  .hud .stat .v{font-size:24px; font-weight:800; color:var(--blue-l);}
  .hud .stat .l{font-size:11px; color:var(--muted); letter-spacing:.1em;}
  .hud .combo .v{color:var(--warn);}
  .hud .timer .v{color:var(--warn);}
  .hud .timer.danger .v{color:var(--bad); animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.4}}

  /* 开始页 */
  .center{text-align:center; padding-top:7vh;}
  .center h1{font-size:46px; margin:16px 0 10px;}
  .center h1 .si{color:var(--blue-l);}
  .center p{color:var(--muted); font-size:16px;}
  .namebox{margin:34px auto 0; max-width:340px;}
  .namebox input{width:100%; padding:14px 16px; font-size:17px; border-radius:12px;
    background:var(--card); border:1px solid var(--line); color:var(--ink); text-align:center;}
  .rules{margin:26px auto 0; max-width:560px; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 22px; font-size:14px; color:var(--muted);}
  .rules b{color:var(--ink);}
  .big{margin-top:26px; background:var(--blue); color:#fff; font-size:20px; font-weight:700; padding:14px 46px;}
  .big:hover{background:#3B74F0;}

  /* 题目卡 */
  .card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px;
    position:relative; overflow:hidden;}
  .card.pop{animation:pop .35s;}
  @keyframes pop{0%{transform:scale(.92); opacity:0}100%{transform:scale(1); opacity:1}}
  .card.shake{animation:shake .4s; border-color:var(--bad)!important;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .card.good{border-color:var(--ok)!important;}
  .qtag{font-size:12px; color:var(--muted); letter-spacing:.1em;}
  .qtext{font-size:24px; font-weight:600; line-height:1.5; margin:12px 0 6px;}
  .sub{color:var(--muted); font-size:14px;}

  .opts{display:grid; gap:12px; margin-top:22px;}
  .opt{display:flex; align-items:center; gap:12px; background:var(--card2);
    border:1px solid var(--line); border-radius:12px; padding:15px 18px; font-size:17px;
    color:var(--ink); text-align:left; width:100%;}
  .opt:hover{border-color:var(--blue-l);}
  .opt .k{width:30px; height:30px; border-radius:8px; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--blue-l); flex:none;}
  .opt.right{border-color:var(--ok); background:rgba(34,197,94,.16);}
  .opt.wrong{border-color:var(--bad); background:rgba(239,68,68,.16);}
  .opt.picked{border:2px solid var(--blue-l); background:rgba(37,99,235,.30); box-shadow:0 0 0 3px rgba(37,99,235,.25);}
  .opt.picked .k{background:var(--blue); color:#fff;}
  .opt:disabled{cursor:default;}

  .judge2{display:flex; gap:16px; margin-top:26px;}
  .judge2 button{flex:1; font-size:22px; font-weight:800; padding:20px;}
  .b-ok{background:var(--ok); color:#06280F;}
  .b-bad{background:var(--bad); color:#2B0A0A;}

  /* 飘分 */
  .float-score{position:fixed; font-size:30px; font-weight:900; color:var(--ok);
    pointer-events:none; animation:rise 1s ease-out forwards; z-index:99;}
  @keyframes rise{0%{opacity:1; transform:translateY(0)}100%{opacity:0; transform:translateY(-70px)}}

  /* 解析条 */
  .exp{margin-top:18px; background:rgba(37,99,235,.1); border-left:3px solid var(--blue);
    border-radius:0 10px 10px 0; padding:13px 16px; font-size:14.5px; color:#D7E2F5;
    display:none;}
  .exp.show{display:block;}
  .exp b{color:var(--blue-l);}

  .nextrow{margin-top:22px; text-align:right;}
  .nextrow button{background:var(--blue); color:#fff; font-size:16px; font-weight:600; padding:12px 28px; display:none;}
  .nextrow button.show{display:inline-block;}

  /* 能带图交互 */
  .band-svg{margin:18px auto; max-width:500px; display:block;}
  .band-zone{cursor:pointer;}
  .band-zone:hover rect{stroke:#fff; stroke-width:2.5;}
  .band-zone.sel rect{stroke:var(--warn); stroke-width:3;}
  .band-hit{font-size:13px; color:var(--muted); text-align:center;}

  /* 排序 */
  .steps{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
  .step{background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; font-size:15px; text-align:left; color:var(--ink);}
  .step.picked{border-color:var(--blue); background:rgba(37,99,235,.16);}
  .step .ord{display:inline-block; width:22px; height:22px; border-radius:50%;
    background:var(--blue); color:#fff; font-size:12px; text-align:center; line-height:22px; margin-right:8px;}
  .step:disabled{cursor:default;}

  /* 结束页 */
  .big-score{font-size:72px; font-weight:900; color:var(--blue-l); margin:10px 0;}
  .grade{font-size:22px; color:var(--warn); font-weight:700;}
  .stat2{display:flex; gap:14px; justify-content:center; margin:22px 0; flex-wrap:wrap;}
  .stat2 .b{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 26px; text-align:center;}
  .stat2 .b .v{font-size:26px; font-weight:800;}
  .stat2 .b .l{font-size:12px; color:var(--muted);}
  @media(max-width:700px){
    .qtext{font-size:20px;} .steps{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ========== 题目 ========== */
const L1 = [
  {q:"硅原子最外层有 4 个价电子，晶体中靠共价键结合。", ans:true, exp:"硅最外层 4 个价电子，每个原子与周围 4 个原子共用电子对，形成共价键。"},
  {q:"价带是电子能量最低、最靠近原子核的那条能带。", ans:false, exp:"能带按能量高低划分，不是按空间位置；价带是被价电子占据的允许带，能量低于导带，但不等于“最靠近原子核”。"},
  {q:"硅中掺入五价元素磷，形成 N 型半导体，多数载流子是电子。", ans:true, exp:"磷是五价，替位后多出一个自由电子 → N 型，多子是电子。"},
  {q:"硅中掺入三价元素硼，形成 P 型半导体。", ans:true, exp:"硼是三价，替位后缺一个电子（空穴）→ P 型。"},
  {q:"只要有光子照到硅上，无论能量多大，都能激发电子-空穴对。", ans:false, exp:"光子能量必须 ≥ 禁带宽度（硅 1.12 eV），能量不足的光子直接穿过。"},
  {q:"PN 结平衡时，P 区的电势高于 N 区。", ans:false, exp:"内建电场 N→P，沿电场方向电势降低，故 N 区电势高于 P 区。"},
];
const L2 = {
  orderSteps:["光子入射到电池片","电子-空穴对产生","内建电场分离载流子","外电路形成电流"],
  correctOrder:[0,1,2,3],
  shuffleOrder:[2,0,3,1],
  spectrum:[
    {q:"1240 nm 红外光（约 1.0 eV）能不能在硅中发电？", ans:false, exp:"1.0 eV < 1.12 eV，能量不足，不能激发。"},
    {q:"550 nm 绿光（约 2.25 eV）能不能在硅中发电？", ans:true, exp:"2.25 eV > 1.12 eV，可以激发。"},
  ]
};
const L3 = [
  {q:"为什么晶体硅成为光伏主流？下列哪些是真实原因？（多选）",
   opts:[
     {t:"硅在地壳中储量极丰，原料便宜且无毒", right:true},
     {t:"硅的理论转换效率全球最高", right:false, why:"错。单结理论效率最高值对应约 1.34 eV 材料，硅并非理论最优。"},
     {t:"微电子几十年工艺积累，硅产业链最成熟", right:true},
     {t:"硅的禁带宽度最宽，什么光都能利用", right:false, why:"错。硅禁带 1.12 eV，远不如 SiC 等材料宽。"},
     {t:"1.12 eV 与太阳光谱匹配较好，效率成本综合最优", right:true},
   ],
   exp:"选对前三条得分；资源 + 工艺 + 光谱匹配，才是硅成主流的真正原因。"},
  {q:"光子能量远大于硅禁带时（如紫外线），下列说法正确的是？（多选）",
   opts:[
     {t:"多余能量以热的形式耗散", right:true},
     {t:"多余能量会让电池片发出更亮的光", right:false, why:"错。多余能量交给晶格发热，不会发光。"},
     {t:"这是单结电池存在理论效率上限的原因之一", right:true},
     {t:"每个光子最多贡献约 1.12 eV 的电能，超出部分变热", right:true},
   ],
   exp:"高能光子把电子激发到导带更高能级后，多余能量以热形式耗散——这就是单结效率上限的根源。"},
];

/* ========== 状态 ========== */
let S = {};
function reset(name){
  S = {name, score:0, combo:0, correct:0, total:0, level:1, idx:0,
       picks:[], orderPick:[], timer:null, timeLeft:20, locked:false};
}
const app = document.getElementById('app');

function startTimer(sec){
  clearInterval(S.timer); S.timeLeft=sec;
  tickTimer();
  S.timer = setInterval(()=>{
    S.timeLeft--;
    if(S.timeLeft<=0){ clearInterval(S.timer); timeUp(); }
    tickTimer();
  },1000);
}
function stopTimer(){ clearInterval(S.timer); S.timer=null; }
function tickTimer(){
  const n=document.getElementById('timerText'); if(!n) return;
  n.textContent = S.timeLeft+"s";
  n.className = S.timeLeft<=5?"v danger":"v";
}
function timeUp(){
  if(S.locked) return; S.locked=true;
  showExp(null, "时间到！正确答案见解析。");
}

function floatScore(x,y,text,color){
  const el=document.createElement('div');
  el.className='float-score'; el.textContent=text;
  el.style.left=x+'px'; el.style.top=y+'px';
  el.style.color=color||'var(--ok)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function addScore(base, e){
  let gain = base;
  S.combo++;
  if(S.combo>=3) gain += 2;   // 连击奖励
  S.score += gain; S.correct++;
  if(e) floatScore(e.clientX, e.clientY, '+'+gain+(S.combo>=3?' 连击×'+S.combo:''));
}
function miss(){ S.combo=0; }

/* ========== 渲染 ========== */
function renderHud(){
  return `<div class="hud">
    <div class="stat"><div class="v">${S.name||'同学'}</div><div class="l">玩家</div></div>
    <div class="stat"><div class="v">${S.score}</div><div class="l">得分</div></div>
    <div class="stat combo"><div class="v">×${S.combo}</div><div class="l">连击</div></div>
    <div class="stat"><div class="v">第 ${S.level} / 3 关</div><div class="l">进度</div></div>
    <div class="stat timer" id="timerBox"><div class="v" id="timerText"></div><div class="l">倒计时</div></div>
  </div>`;
}

function render(){
  if(S.name===undefined) return renderHome();
  if(S.level===1) return renderL1();
  if(S.level===2) return renderL2();
  if(S.level===3) return renderL3();
  return renderEnd();
}

function renderHome(){
  app.innerHTML = `<div class="center">
    <span class="tag">新能源发电系统设计</span>
    <h1>半导体基础知识 · <span class="si">知识闯关</span></h1>
    <p>三关共 180 分。判断速答限时 20 秒，连对 3 题起每次额外 +2 分。</p>
    <div class="namebox"><input id="nameInput" placeholder="输入你的名字" maxlength="10"></div>
    <div class="rules">
      <b>玩法</b>：点选你认为对的答案；答对卡片变绿加分，答错变红并显示解析。<br>
      <b>范围</b>：硅材料、P/N 型掺杂、能带与禁带、PN 结、光伏效应。
    </div>
    <button class="big" onclick="begin()">开始挑战</button>
  </div>`;
}
function begin(){
  const n = document.getElementById('nameInput').value.trim() || '同学';
  reset(n); render();
}

/* ---- 第一关：判断 ---- */
function renderL1(){
  const q = L1[S.idx];
  stopTimer();
  app.innerHTML = renderHud() + `<div class="card pop" id="card">
    <div class="qtag">第一关 · 概念速答　第 ${S.idx+1}/${L1.length} 题</div>
    <div class="qtext">${q.q}</div>
    <div class="judge2" id="opts">
      <button class="b-ok" onclick="judge(true,event)">√ 正确</button>
      <button class="b-bad" onclick="judge(false,event)">× 错误</button>
    </div>
    <div class="exp" id="exp"></div>
    <div class="nextrow"><button id="nextBtn" onclick="nextL1()">${S.idx===L1.length-1?'进入第二关':'下一题'}</button></div>
  </div>`;
  startTimer(20);
}
function judge(ans, e){
  if(S.locked) return;
  S.locked = true; stopTimer();
  const q = L1[S.idx]; S.total++;
  const card = document.getElementById('card');
  const opts = document.getElementById('opts');
  opts.innerHTML = '';
  if(ans === q.ans){
    card.classList.add('good'); addScore(10, e);
  } else {
    card.classList.add('shake'); miss();
  }
  showExp(q, `正确答案：${q.ans?'√ 正确':'× 错误'}　`);
}
function showExp(q, head){
  const exp = document.getElementById('exp');
  exp.innerHTML = `<b>${head||''}</b>${q? q.exp:''}`;
  exp.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}
function nextL1(){
  S.locked=false;
  if(S.idx < L1.length-1){ S.idx++; render(); }
  else { S.level=2; S.idx=0; render(); }
}

/* ---- 第二关 ---- */
function renderL2(){
  if(S.idx===0) return renderBand();
  if(S.idx===1) return renderOrder();
  return renderSpectrum();
}
function renderBand(){
  stopTimer();
  S.locked=false; S.bandPick=[];
  app.innerHTML = renderHud() + `<div class="card pop" id="card">
    <div class="qtag">第二关 · 识图　第 1/3 题（20 分）</div>
    <div class="qtext">电子要被光子激发导电，先点它<b class="hl">现在所在的带</b>，再点它<b class="hl">要去的带</b>。</div>
    <svg class="band-svg" viewBox="0 0 500 240" width="100%">
      <g class="band-zone" data-band="cb" onclick="pickBand('cb',event)">
        <rect x="70" y="18" width="360" height="62" rx="8" fill="rgba(37,99,235,.28)" stroke="#60A5FA" stroke-width="1.5"/>
        <text x="250" y="55" text-anchor="middle" fill="#EAF1FF" font-size="16">导带（空）</text>
      </g>
      <line x1="250" y1="100" x2="250" y2="140" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 3"/>
      <polygon points="250,148 244,138 256,138" fill="#F59E0B"/>
      <text x="268" y="125" fill="#F59E0B" font-size="13">光子</text>
      <g class="band-zone" data-band="vb" onclick="pickBand('vb',event)">
        <rect x="70" y="150" width="360" height="62" rx="8" fill="rgba(245,158,11,.22)" stroke="#F59E0B" stroke-width="1.5"/>
        <text x="250" y="187" text-anchor="middle" fill="#FFE9C7" font-size="16">价带（满）</text>
      </g>
    </svg>
    <div class="band-hit">已选：<span id="bandSel">（未选）</span></div>
    <div class="exp" id="exp"></div>
    <div class="nextrow"><button id="nextBtn" onclick="nextL2()">下一题</button></div>
  </div>`;
}
function pickBand(b, e){
  if(S.locked) return;
  S.bandPick.push(b);
  document.querySelectorAll('.band-zone').forEach(z=>z.classList.toggle('sel', S.bandPick.includes(z.dataset.band)));
  document.getElementById('bandSel').textContent = S.bandPick.join(' → ');
  if(S.bandPick.length===2){
    S.locked=true; S.total++;
    const card=document.getElementById('card');
    if(S.bandPick[0]==='vb' && S.bandPick[1]==='cb'){ card.classList.add('good'); addScore(20,e);
      showExp({exp:"电子从价带（满）跃迁到导带（空），才变成可自由移动的载流子；硅的禁带宽度约 1.12 eV。"},"回答正确。");
    } else { card.classList.add('shake'); miss();
      showExp({exp:"电子本来在价带里，被光子激发后要跳到导带。顺序应为：价带 → 导带。"},"顺序不对。");
    }
  }
}
function renderOrder(){
  stopTimer();
  S.locked=false; S.orderPick=[];
  const shown = L2.shuffleOrder.map((sid,pos)=>
    `<button class="step" data-id="${sid}" onclick="pickStep(${sid},event)">
      <span class="ord">?</span>${L2.orderSteps[sid]}</button>`).join("");
  app.innerHTML = renderHud() + `<div class="card pop" id="card">
    <div class="qtag">第二关 · 排序　第 2/3 题（20 分）</div>
    <div class="qtext">把光伏效应按发生顺序依次点出来。</div>
    <div class="steps">${shown}</div>
    <div class="exp" id="exp"></div>
    <div class="nextrow"><button id="nextBtn" onclick="nextL2()">下一题</button></div>
  </div>`;
}
function pickStep(id, e){
  if(S.locked) return;
  S.orderPick.push(id);
  const btn = document.querySelector(`.step[data-id="${id}"]`);
  btn.classList.add('picked'); btn.querySelector('.ord').textContent = S.orderPick.length;
  if(S.orderPick.length===4){
    S.locked=true; S.total++;
    const ok = S.orderPick.every((v,i)=>v===L2.correctOrder[i]);
    const card=document.getElementById('card');
    if(ok){ card.classList.add('good'); addScore(20,e);
      showExp({exp:"①光子入射 → ②电子-空穴对产生 → ③内建电场分离 → ④外电路形成电流。"},"顺序正确。");
    } else { card.classList.add('shake'); miss();
      showExp({exp:"正确顺序：光子入射 → 电子-空穴对产生 → 内建电场分离 → 外电路形成电流。"},"顺序有误，再想想因果关系。");
    }
  }
}
function renderSpectrum(){
  stopTimer();
  S.locked=false; S.specIdx=0;
  app.innerHTML = renderHud() + `<div class="card pop" id="card">
    <div class="qtag">第二关 · 判断　第 3/3 题（每题 10 分）</div>
    <div class="qtext" id="specQ">${L2.spectrum[0].q}</div>
    <div class="judge2" id="specOpts">
      <button class="b-ok" onclick="specJudge(true,event)">能发电</button>
      <button class="b-bad" onclick="specJudge(false,event)">不能发电</button>
    </div>
    <div class="exp" id="exp"></div>
    <div class="nextrow"><button id="nextBtn" onclick="nextL2()">进入第三关</button></div>
  </div>`;
}
function specJudge(ans, e){
  if(S.locked) return;
  const it = L2.spectrum[S.specIdx];
  S.total++;
  if(ans===it.ans){ addScore(10,e); } else { miss(); }
  document.getElementById('specOpts').innerHTML='';
  if(S.specIdx < L2.spectrum.length-1){
    S.specIdx++;
    document.getElementById('specQ').textContent = L2.spectrum[S.specIdx].q;
    document.getElementById('exp').classList.remove('show');
    document.getElementById('exp').innerHTML='';
    document.getElementById('specOpts').innerHTML =
      `<button class="b-ok" onclick="specJudge(true,event)">能发电</button><button class="b-bad" onclick="specJudge(false,event)">不能发电</button>`;
  } else {
    S.locked=true;
    const exp=document.getElementById('exp');
    exp.innerHTML=`<b>依据：</b>光子能量 ≥ 硅禁带 1.12 eV 才能激发。红外 1.0 eV 不行，绿光 2.25 eV 行。`;
    exp.classList.add('show');
    document.getElementById('nextBtn').classList.add('show');
  }
}
function nextL2(){
  S.level=3; S.idx=0; render();
}

/* ---- 第三关：多选 ---- */
function renderL3(){
  const q = L3[S.idx];
  stopTimer();
  S.locked=false; S.picked=new Set();
  const opts = q.opts.map((o,i)=>
    `<button class="opt" data-i="${i}" onclick="togglePick(${i})"><span class="k">${"ABCDEFGH"[i]}</span>${o.t}</button>`).join("");
  app.innerHTML = renderHud() + `<div class="card pop" id="card">
    <div class="qtag">第三关 · 工程思辨　第 ${S.idx+1}/${L3.length} 题（多选，选对项每项 +10，错选 −10）</div>
    <div class="qtext">${q.q}</div>
    <p class="sub" style="margin-top:6px">先勾选你认为正确的项（可再点取消），选完后点"提交答案"。</p>
    <div class="opts" id="opts">${opts}</div>
    <div class="exp" id="exp"></div>
    <div class="nextrow">
      <button id="submitBtn" style="display:none;background:var(--warn);color:#2B1A00;" onclick="submitMulti(event)">提交答案</button>
      <button id="nextBtn" onclick="nextL3()">${S.idx===L3.length-1?'查看成绩':'下一题'}</button>
    </div>
  </div>`;
}
function togglePick(i){
  if(S.locked) return;
  const btn = document.querySelector(`.opt[data-i="${i}"]`);
  if(S.picked.has(i)){ S.picked.delete(i); btn.classList.remove('picked'); }
  else { S.picked.add(i); btn.classList.add('picked'); }
  document.getElementById('submitBtn').style.display = S.picked.size>0 ? 'inline-block':'none';
}
function submitMulti(e){
  if(S.locked || S.picked.size===0) return;
  S.locked = true;
  const q = L3[S.idx];
  document.querySelectorAll('.opt').forEach(btn=>{
    const i = +btn.dataset.i;
    const o = q.opts[i];
    btn.disabled = true;
    if(S.picked.has(i)){
      S.total++;
      if(o.right){ btn.classList.add('right'); S.rightPicked++; addScore(10,e); }
      else { btn.classList.add('wrong'); S.score=Math.max(0,S.score-10); miss();
        floatScore(e.clientX, e.clientY, '-10', 'var(--bad)'); }
    } else if(o.right){
      btn.classList.add('right'); // 漏选的正确项也标出来
    }
  });
  document.getElementById('submitBtn').style.display='none';
  const exp=document.getElementById('exp');
  const letters = "ABCDEFGH";
  const rightLetters = q.opts.map((o,i)=>o.right ? letters[i] : null).filter(Boolean).join('、');
  const detail = q.opts.map((o,i)=>{
    const L = letters[i];
    if(o.right) return `<b style="color:#86EFAC">${L}. ${o.t}</b> —— 正确项`;
    else return `<b style="color:#FCA5A5">${L}. ${o.t}</b> —— ${o.why||'错误'}`;
  }).join('<br>');
  exp.innerHTML=`<b>正确答案：${rightLetters}</b><br>${q.exp}<br><br>${detail}`;
  exp.classList.add('show');
  document.getElementById('nextBtn').classList.add('show');
}
function nextL3(){
  if(S.idx < L3.length-1){ S.idx++; render(); }
  else { S.level=4; render(); }
}

/* ---- 结束 ---- */
function renderEnd(){
  const acc = S.total? Math.round(S.correct/S.total*100):0;
  const grade = S.score>=150?'优秀':S.score>=110?'良好':S.score>=70?'及格':'继续加油';
  app.innerHTML = `<div class="center">
    <span class="tag">闯关完成</span>
    <h1>${S.name}，你的成绩</h1>
    <div class="big-score">${S.score}</div>
    <div class="grade">${grade}</div>
    <div class="stat2">
      <div class="b"><div class="v">${S.correct}</div><div class="l">答对题次</div></div>
      <div class="b"><div class="v">${acc}%</div><div class="l">正确率</div></div>
      <div class="b"><div class="v">×${S.combo}</div><div class="l">最终连击</div></div>
    </div>
    <p style="color:var(--muted)">重点回顾：价带不是空间位置概念；电子从价带跃迁至导带；PN 结内建电场负责分离载流子。</p>
    <div><button class="big" onclick="renderHome()">再玩一次</button></div>
  </div>`;
}

renderHome();
</script>
</body>
</html>
